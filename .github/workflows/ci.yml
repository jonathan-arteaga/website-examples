name: Verify and deploy portfolio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Deploy a verified preview
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_ORIGIN: ${{ vars.PORTFOLIO_ORIGIN || 'https://website-examples-alpha.vercel.app' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/hearthmere-residential/public/_responsive
          key: portfolio-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: portfolio-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm audit --audit-level=high --prod
      - name: Check deployment credential
        id: deployment-auth
        if: github.event_name != 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Automatic deployment is pending configuration of the project-scoped VERCEL_TOKEN secret. Verification still ran in full.'
          fi
      - name: Deploy verified production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deployment-auth.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Deploy requested preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview && steps.deployment-auth.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-verification
          path: |
            test-results
            playwright-report
          retention-days: 7
